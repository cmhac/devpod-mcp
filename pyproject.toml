[project]
name = "devpod-mcp"
version = "0.1.0"
description = "MCP server giving agents list/status/run/stop access to existing DevPod workspaces"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.2.0",
]

[project.scripts]
devpod-mcp = "devpod_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devpod_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.12"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "ruff>=0.16",
    "ty>=0.0.84",
]
