[project]
name = "devpod-mcp"
version = "0.1.0"
description = "MCP server giving agents list/status/run/stop access to existing DevPod workspaces"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.2.0",
]

[project.scripts]
devpod-mcp = "devpod_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devpod_mcp"]
